name: CI build
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild eqw_takp.sln /p:Configuration=Release /p:Platform=x86 /p:LanguageStandard=stdcpp20
      - uses: actions/upload-artifact@v4
        with:
          name: eqw
          path: |
            Release/eqw.dll
            Release/eqw.pdb
